[StreamSettings]
PERMANENT_STREAM_ID = <enter your permanent stream ID as reported by get_stream_id.py>
PLAYLIST_ID = <enter the playlist ID you'd like the stream to be added to - this is the portion of your playlist's URL after the argument &list=>
stream_title = Enter your title here, the curly brace parameter will be substituted with the current date - {date}
categoryId = a number representing a youtube video category, ex. 15 = Pets and Animals
privacyStatus = public (or priavte, or unlisted)
selfDeclaredMadeForKids = False (set appropriately for age controls)
containsSyntheticMedia = False (set appropriately for AI declaration)
tags = comma separated list of tags ex. fish.turtles,underwater,livestream

stream_description = This is the first paragraph of your video description

    This is another paragraph in your video description

    This is yet another paragraph in your video description

input_stream = <your IP camera's stream URL ex. Barlus typer B camera: rtsp://192.168.1.10:554/user=admin&password=&channel=1&stream=0.sdp>
stream_destination = rtmp://x.rtmp.youtube.com/live2/<your youtube livestream key> 
audio_file = <optional path to a audio file to loop as substitution for the audio stream from the camera ex. pondsound.mp3 - remove this entry if no audio loop is desired>
